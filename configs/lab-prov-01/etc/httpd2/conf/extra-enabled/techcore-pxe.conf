# TechCore PXE-слой. Читает: Apache (httpd2), глобальный scope.
# Подключается через Include conf/extra-enabled/*.conf (httpd2.conf:166).

<Directory /var/www/html/alt-p10>
    Options +Indexes +FollowSymLinks
    Require all granted
</Directory>

<Directory /var/www/html/kickstarts>
    Options +Indexes
    Require all granted
</Directory>

<Directory /var/www/html/trigger>
    Options +ExecCGI
    AddHandler cgi-script .cgi .sh
    <Files "installed">
        SetHandler cgi-script
    </Files>
    Require all granted
</Directory>
