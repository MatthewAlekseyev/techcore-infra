# ============================================================================
#  TechCore :: dnsmasq.conf :: lab-prov-01 (ALT p10, Фаза 1)
#  Читает: демон dnsmasq на сервере. НЕ загружаемая ВМ (меню живёт в
#  pxelinux.cfg/default, kickstart читает инсталлятор ALT по HTTP).
#  Роль: ФРОНТЕНД провижининга — кадры 1-8 цепочки PXE (DHCP+TFTP до старта
#  ядра). DNS глушим: это роль lab-dc-01 / Samba AD в Фазе 2.
#  Все значения — литералы, сверены с ADR-0001 (enp0s8 = 192.168.100.10/24).
# ============================================================================

# ---- Секция 1. Привязка к сетям: первый пояс изоляции ----------------------
# Слушать ТОЛЬКО внутренний PXE-сегмент enp0s8. Без этого dnsmasq полезет в
# NAT-сегмент enp0s3 и начнёт конкурировать со встроенным DHCP VirtualBox.
interface=enp0s8
# bind-interfaces: привязать сокет к IP enp0s8, а не к 0.0.0.0 (все адреса).
# Жёстче, чем фильтрация на уровне логики. Цена: демон не стартует, если
# enp0s8 на момент запуска не поднят — юнит dnsmasq обязан идти после сети.
bind-interfaces
# except-interface: второй пояс + самодокументация «наружу не ходим».
except-interface=enp0s3

# ---- Секция 2. DNS выключен осознанно --------------------------------------
# port=0: порт 53 не открывается вообще. Освобождаем его под AD-DNS на .20
# в Фазе 2. Принцип IaC: ненужную функцию выключают явно, не оставляют «на потом».
port=0
# no-hosts: не пересказывать клиентам /etc/hosts (мы правим его под Kerberos,
# а не под DNS). Страховка на случай, если кто-то позже уберёт port=0.
no-hosts

# ---- Секция 3. Приборная панель ---------------------------------------------
# log-dhcp: писать каждый DISCOVER/OFFER/REQUEST/ACK с MAC. Без этого отладка
# PXE вслепую — не увидеть, дошёл ли запрос клиента до сервера.
log-dhcp
# Отдельный файл вместо journald: tail -f показывает только DHCP/TFTP-события.
log-facility=/var/log/dnsmasq.log

# ---- Секция 4. DHCP: пул и авторитетность -----------------------------------
# Пул для машин БЕЗ per-MAC брони. 24h — короткая аренда полезна в лабе со
# снапшотами: удалённая ВМ быстрее освобождает адрес, пул не зарастает.
dhcp-range=192.168.100.100,192.168.100.200,24h
# Авторитетность: вернувшаяся из снапшота машина с чужой арендой получит
# быстрый NAK->REQUEST вместо минутного таймаута. Спасает нервы при отладке.
dhcp-authoritative

# ---- Секция 5. DHCP-опции: только честные для Фазы 1 -----------------------
#RFC 2132. Здесь задаём ТОЛЬКО то, что реально работает на этом этапе.
#
# Опция 3 (router) НЕ задаём: lab-prov-01 не роутит (ADR-0002: forward policy
#   drop). Рекламировать .10 как шлюз = ложь о топологии. PXE-клиенты живут в
#   internal-сегменте без default route, установщик ходит за kickstart/RPM по
#   IP .10 внутри /24 — шлюз им не нужен. Добавить в Фазе 3, когда lab-gw-01
#   (.30) сделает NAT: dhcp-option=3,192.168.100.30
#
# Опция 6 (DNS) НЕ задаём: port=0 -> dnsmasq не DNS, значит .10 в списке DNS
#   мёртв; 8.8.8.8 недостижим из internal-сегмента без шлюза. Добавить в Фазе 2,
#   когда lab-dc-01 (.20) поднимет AD-DNS: dhcp-option=6,192.168.100.20,8.8.8.8
#
# Опция 28 (broadcast) — честная: 192.168.100.255 реальный широковещательный
#   адрес сегмента /24. Гигиена для старых установщиков.
dhcp-option=28,192.168.100.255
# Опция 54 (server identifier) — честная: .10 реальный DHCP-сервер сегмента.
#   Явное указание делает конфиг читаемым и устойчивым к будущим правкам.
dhcp-option=54,192.168.100.10

# ---- Секция 6. TFTP ---------------------------------------------------------
# enable-tftp: включить встроенный TFTP-сервер (по умолчанию выключен). Без
#   него клиент получит IP и имя загрузчика, но стучаться в 69-й будет некому.
enable-tftp
# tftp-root: песочница. Клиент не выйдет за её пределы (защита от ../). Путь
#   выбран по FHS (данные демона -> /var/lib/<демон>, как /var/lib/libvirt для
#   KVM) и совпадает с дефолтом ALT и SELinux-контекстом tftpdir_t.
tftp-root=/var/lib/tftpboot
#   VirtualBox-свитча, чтобы не словить фрагментацию. Это оптимизация скорости,
# МИНА STATEFUL-ФАЕРВОЛА (TFTP отвечает данными с плавающего эфемерного порта,
#   который conntrack без парсера не связывает с RRQ на 69 -> первый DATA-блок
#   дропается -> чёрный экран на живом тесте). Закрывается НЕ этой строкой, а
#   модулем ядра: modprobe nf_conntrack_tftp (см. ШАГ 1 финишного плана), плюс
#   закрепление в /etc/modules-load.d/. Поэтому здесь НЕТ tftp-portrange: он
#   мог бы уронить --test на синтаксисе диапазона в некоторых версиях, а линия
#   conntrack закрывает мину без правки конфига. Ограничение названо, не спрятано.

# ---- Секция 7. PXE: выбор загрузчика по архитектуре клиента ----------------
# Прошивка сообщает архитектуру в DHCP-опции 93 (client-architecture). Это
#   надёжнее, чем парсить строку op 60 (формат гуляет у разных ROM-вендоров).
#   dhcp-match навешивает тег; dhcp-boot=tag: выдаёт файл только тегированным.
# BIOS (x86 legacy, код 0) -> pxelinux.0 (16-битный реальный режим).
dhcp-match=set:bios,option:client-arch,0
# UEFI x64 (коды 7 = EFI BC, 9 = EFI x86-64) -> один тег efi.
dhcp-match=set:efi,option:client-arch,7
dhcp-match=set:efi,option:client-arch,9
# Выдача bootfile. Четыре аргумента: tag, имя файла (op 67), имя сервера,
#   IP сервера (op 66). IP важнее имени — клиент использует адрес.
dhcp-boot=tag:bios,pxelinux.0,lab-prov-01,192.168.100.10
# EFI-ветка ЗАРЕЗЕРВИРОВАНА: grubx64.efi НЕ лежит в tftp-root в Фазе 1 (все
#   ВМ лабы BIOS, EFI off в VirtualBox). Строки инертны, но документируют
#   понимание архитектуры и готовы к фазе UEFI без переписывания детекта.
dhcp-boot=tag:efi,grubx64.efi,lab-prov-01,192.168.100.10
# Fallback БЕЗ тега — обязателен. Неизвестный/странный клиент или BIOS-ROM без
#   op 93 получает pxelinux.0 (верно для BIOS). Без fallback клиент не узнает,
#   что качать, и PXE-ROM зависнет на «no boot file».
dhcp-boot=pxelinux.0,lab-prov-01,192.168.100.10

# ---- Секция 8. Per-MAC инвентарь (замена cobbler object system) ------------
# Раскомментировать при создании lab-dc-01, подставив реальный MAC из VirtualBox.
# Эффект тройной: всегда .20 (резерв, не из пула); имя lab-dc-01 в логах
# log-dhcp; инвентарь прямо в DHCP. Формат: MAC, IP, hostname, lease.
# dhcp-host=<MAC-lab-dc-01>,192.168.100.20,lab-dc-01,24h

# ---- Секция 9. Меню прошивки, этаж 1 (DHCP op 43) --------------------------
# Это НЕ меню pxelinux (этаж 2 живёт в pxelinux.cfg/default). Здесь прошивка
#   спрашивает «есть PXE-сервис?». В лабе с одним сервисом этаж проскакивает
#   незаметно, но обязан быть, иначе некоторые ROM не покажут подсказку F8.
pxe-prompt="Press F8 for menu...", 10
pxe-service=X86PC, "ALT Linux p10 Server", pxelinux
